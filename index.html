<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0057a8"><meta name="description" content="卡客车轮胎参数移动查询"><link rel="manifest" href="manifest.webmanifest"><title>卡客车轮胎参数查询</title><link rel="stylesheet" href="styles.css"><style>.brand-logo{display:block;width:136px;max-width:38vw;height:auto;object-fit:contain;flex:none}.size-picker{position:relative}.size-options{position:absolute;z-index:10;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px #15334a24}.size-options[hidden]{display:none}.size-option{display:block;width:100%;padding:12px 13px;border:0;border-bottom:1px solid #edf1f4;background:#fff;color:var(--ink);text-align:left;font:inherit;cursor:pointer}.size-option:hover,.size-option:focus{background:#e7f2fc;outline:0}.size-empty{padding:12px 13px;color:var(--muted);font-size:14px}</style></head>
<body><header class="hero"><div class="brand"><img class="brand-logo" src="asset/michelin-logo.png" alt="Michelin"><div><div class="eyebrow">OE CUSTOMER TECHNICAL TOOL</div><h1>卡客车轮胎参数查询</h1></div></div></header>
<main><section class="search-panel"><div class="step"><span>1</span><label for="sizeFilter">筛选尺寸</label></div><div class="size-picker"><input id="sizeFilter" type="search" placeholder="输入尺寸，例如 315" autocomplete="off" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="sizeOptions"><div id="sizeOptions" class="size-options" role="listbox" aria-label="匹配的尺寸" hidden></div></div><div class="step"><span>2</span><label for="patternSelect">选择花纹</label></div><select id="patternSelect" disabled><option value="">请先选择尺寸</option></select><div class="quick"><input id="keyword" type="search" placeholder="或输入 CAI / 规格 / 花纹关键词"><button id="searchBtn">查询</button></div></section>
<section class="status"><div><strong id="resultTitle">请选择尺寸和花纹</strong><small id="recordInfo"></small></div><button id="resetBtn" class="link">重置</button></section><section id="results" class="results"><div class="empty">选择尺寸后，系统将仅显示该尺寸对应的花纹。</div></section></main>
<footer><div id="dataStamp"></div><div>Built by CHN/T &nbsp;|&nbsp; technical contact: <a href="mailto:jing.li@michelin.com">jing.li@michelin.com</a></div></footer>
<script src="app.js"></script></body></html>
